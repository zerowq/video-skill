[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-skill"
version = "0.2.0"
description = "Provider-neutral AI video production workflow core"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "zerowq"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
video-skill = "video_skill.cli:main"

[tool.setuptools.packages.find]
include = ["video_skill*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
